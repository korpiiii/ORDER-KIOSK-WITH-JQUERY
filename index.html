<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wild Roots Cafe - Digital Kiosk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --earth-green: #556B2F;
            --forest-brown: #654321;
            --cream: #FFFDD0;
        }
        body {
            background-color: var(--cream);
            font-family: 'Georgia', serif;
        }
        .brand-header {
            background-color: var(--earth-green);
            color: #fff;
            padding: 30px 0;
            border-bottom: 5px solid var(--forest-brown);
        }
        .menu-item {
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .menu-item:hover {
            transform: translateY(-5px);
        }
        .card {
            border: 2px solid var(--forest-brown);
            height: 100%;
        }
        .cart-section {
            background-color: rgba(255, 253, 208, 0.9);
            border-left: 3px solid var(--forest-brown);
            min-height: 100vh;
        }
        .btn-primary {
            background-color: var(--earth-green);
            border: none;
        }
        .btn-primary:hover {
            background-color: var(--forest-brown);
        }
        .receipt-item {
            border-bottom: 1px dashed var(--forest-brown);
            padding: 8px 0;
        }
        .cart-item {
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <div class="row brand-header">
            <div class="col text-center">
                <h1 class="display-4 fw-bold">Wild Roots Cafe</h1>
                <h3>Seasonal Wild Kitchen</h3>
            </div>
        </div>

        <div class="row">
            <!-- Menu Section -->
            <div class="col-md-8 p-4">
                <div class="row row-cols-1 row-cols-md-3 g-4" id="menuItems"></div>
            </div>

            <!-- Cart Section -->
            <div class="col-md-4 p-4 cart-section">
                <h3 class="mb-4 fw-bold">Current Harvest</h3>
                <div id="cartItems" class="mb-4"></div>
                <div class="total-section bg-earth-green p-3 rounded">
                    <h4 class="mb-0 text-cream">Total: $<span id="totalAmount">0.00</span></h4>
                </div>
                <button class="btn btn-lg w-100 mt-4 text-cream" id="checkoutBtn" style="background-color: var(--forest-brown);">Complete Foraging</button>
            </div>
        </div>
    </div>

    <!-- Receipt Modal -->
    <div class="modal fade" id="receiptModal">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background-color: var(--cream);">
                <div class="modal-header border-0">
                    <h3 class="modal-title fw-bold">Wild Roots Receipt</h3>
                </div>
                <div class="modal-body" id="receiptContent"></div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-earth-green text-cream" data-bs-dismiss="modal">Return to the Forest</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function() {
            let cart = [];
            const menuItems = [
                { id: 1, name: "Forest Floor Latte", price: 6.50, image: "images/Forest Floor Latte.avif" },
                { id: 2, name: "Sunrise Smoothie Bowl", price: 9.00, image: "images/sunrise smoothie bowl.png" },
                { id: 3, name: "Wild Berry Pavlova", price: 8.50, image: "images/Wild Berry Pavlova.jpg" },
                { id: 4, name: "Rooted Burger", price: 12.00, image: "images/rootedburger.jpg" },
                { id: 5, name: "Moss Caprese Salad", price: 10.50, image: "images/Moss Caprese Salad.jpg" },
                { id: 6, name: "Dewdrop Chia Pudding", price: 7.50, image: "images/Dewdrop Chia Pudding.webp" },
                { id: 7, name: "Campfire Chocolate Tart", price: 8.00, image: "images/Campfire Chocolate Tart.jpg" },
                { id: 8, name: "Windfall Iced Tea", price: 5.50, image: "images/Windfall Iced Tea.webp" }
            ];

            function loadMenu() {
                let menuHtml = '';
                menuItems.forEach(item => {
                    menuHtml += `
                        <div class="col">
                            <div class="card menu-item h-100">
                                <img src="${item.image}" class="card-img-top" alt="${item.name}" style="height: 200px; object-fit: cover;">
                                <div class="card-body">
                                    <h5 class="card-title fw-bold">${item.name}</h5>
                                    <p class="card-text">${getDescription(item.name)}</p>
                                    <p class="card-text fw-bold mt-2">$${item.price.toFixed(2)}</p>
                                    <button class="btn btn-primary add-to-cart" data-id="${item.id}">Add to Basket</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                $('#menuItems').html(menuHtml);
            }

            function getDescription(itemName) {
                const descriptions = {
                    "Forest Floor Latte": "Mushroom-infused espresso + oat milk foam",
                    "Sunrise Smoothie Bowl": "Turmeric, mango, strawberries",
                    "Wild Berry Pavlova": "Meringue + foraged berries + elderflower",
                    "Rooted Burger": "Beetroot patty, charcoal bun, wild greens",
                    "Moss Caprese Salad": "Pesto, green tomatoes, basil snow",
                    "Dewdrop Chia Pudding": "Lavender honey, bee pollen, blueberries",
                    "Campfire Chocolate Tart": "Smoked salt, cedar-infused ganache",
                    "Windfall Iced Tea": "Apple, rosemary, sparkling rainwater"
                };
                return descriptions[itemName];
            }

            function updateCart() {
                let cartHtml = '';
                let total = 0;
                
                cart.forEach(item => {
                    total += item.price * item.quantity;
                    cartHtml += `
                        <div class="cart-item">
                            ${item.name} 
                            <button class="btn btn-sm btn-danger float-end remove-item" data-id="${item.id}">×</button>
                            <div class="float-end mx-2">
                                $${(item.price * item.quantity).toFixed(2)}
                            </div>
                            <div class="float-end mx-2">
                                <button class="btn btn-sm btn-secondary decrement" data-id="${item.id}">-</button>
                                <span class="mx-1">${item.quantity}</span>
                                <button class="btn btn-sm btn-secondary increment" data-id="${item.id}">+</button>
                            </div>
                        </div>
                    `;
                });

                $('#cartItems').html(cartHtml);
                $('#totalAmount').text(total.toFixed(2));
            }

            $(document).on('click', '.add-to-cart', function() {
                const itemId = parseInt($(this).data('id'));
                const menuItem = menuItems.find(item => item.id === itemId);
                const existingItem = cart.find(item => item.id === itemId);

                if (existingItem) {
                    existingItem.quantity++;
                } else {
                    cart.push({
                        id: menuItem.id,
                        name: menuItem.name,
                        price: menuItem.price,
                        quantity: 1
                    });
                }
                updateCart();
            });

            $(document).on('click', '.remove-item', function() {
                const itemId = parseInt($(this).data('id'));
                cart = cart.filter(item => item.id !== itemId);
                updateCart();
            });

            $(document).on('click', '.increment', function() {
                const itemId = parseInt($(this).data('id'));
                const cartItem = cart.find(item => item.id === itemId);
                cartItem.quantity++;
                updateCart();
            });

            $(document).on('click', '.decrement', function() {
                const itemId = parseInt($(this).data('id'));
                const cartItem = cart.find(item => item.id === itemId);
                
                if (cartItem.quantity > 1) {
                    cartItem.quantity--;
                } else {
                    cart = cart.filter(item => item.id !== itemId);
                }
                updateCart();
            });

            $('#checkoutBtn').click(function() {
                if (cart.length === 0) return;
                
                let receiptHtml = `
                    <h4 class="text-center mb-4">Wild Roots Cafe Receipt</h4>
                    <div class="receipt-items">
                `;
                
                cart.forEach(item => {
                    receiptHtml += `
                        <div class="receipt-item">
                            <div class="row">
                                <div class="col-6">${item.name}</div>
                                <div class="col-3 text-center">${item.quantity}x</div>
                                <div class="col-3 text-end">$${(item.price * item.quantity).toFixed(2)}</div>
                            </div>
                        </div>
                    `;
                });

                receiptHtml += `
                    </div>
                    <hr>
                    <div class="total text-end">
                        <h4>Total: $${$('#totalAmount').text()}</h4>
                    </div>
                    <p class="text-center mt-4">Thank you for foraging with us!</p>
                `;

                $('#receiptContent').html(receiptHtml);
                $('#receiptModal').modal('show');
                cart = [];
                updateCart();
            });

            loadMenu();
        });
    </script>
</body>
</html>
